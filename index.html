<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Announcement</title>
    <style>
      :root {
        --bg1: #120b24;
        --bg2: #1d1137;
        --bg3: #0d3d33;
        --violet: #9b7dff;
        --violet-strong: #b994ff;
        --green: #7fe5c0;
        --green-strong: #9df7d4;
        --mint: #dffef2;
        --text: #edf6ff;
        --muted: #d3def2;
        --subtle: #9bb4d7;
        --line: rgba(255,255,255,0.14);
        --card: rgba(19,14,32,0.75);
        --panel: rgba(255,255,255,0.04);
        --danger: #ff7f9d;
        --warning: #ffd77c;
        --success: #9af0c8;
        --shadow: rgba(96,62,151,0.4);
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(185,148,255,0.5), transparent 24%),
          radial-gradient(circle at top right, rgba(157,247,212,0.34), transparent 28%),
          radial-gradient(circle at bottom center, rgba(84,123,255,0.22), transparent 30%),
          linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 42%, var(--bg3) 100%);
        color: var(--text);
      }

      body {
        padding: 0;
        overflow-x: hidden;
      }
      .hidden { display: none !important; }

      .toast-container {
        position: fixed;
        right: 20px;
        bottom: 20px;
        display: grid;
        gap: 10px;
        z-index: 200;
      }

      .toast {
        min-width: 220px;
        max-width: 320px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(15, 16, 30, 0.9);
        color: var(--text);
        box-shadow: 0 14px 28px rgba(0,0,0,0.25);
        opacity: 0;
        transform: translateY(8px);
        transition: all 0.22s ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .toast.success {
        border-color: rgba(127,229,192,0.45);
        background: rgba(12, 37, 31, 0.9);
      }

      .toast.error {
        border-color: rgba(255,127,157,0.45);
        background: rgba(44, 15, 25, 0.92);
      }

      .app-shell {
        width: 100%;
        max-width: 100%;
        margin: 0;
        min-height: 100vh;
      }

      .app-shell.student-shell {
        max-width: 100%;
        width: 100%;
      }

      .content {
        width: 100%;
        max-width: none;
        padding: 0;
      }

      .sidebar {
        position: fixed;
        top: 18px;
        right: 18px;
        width: min(86vw, 260px);
        min-height: calc(100vh - 36px);
        background: rgba(22,17,36,0.96);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 26px;
        padding: 18px 16px;
        display: grid;
        gap: 18px;
        align-content: start;
        box-shadow: 0 20px 50px rgba(100,70,145,0.35);
        backdrop-filter: blur(16px);
        overflow: hidden;
        transform: translateX(calc(100% + 24px));
        transition: transform 0.25s ease;
        z-index: 40;
      }

      .sidebar.expanded {
        transform: translateX(0);
      }

      .sidebar-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-mark {
        width: 46px;
        height: 46px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        font-weight: 700;
        background: linear-gradient(135deg, var(--violet), var(--green));
        color: #fff;
      }

      .brand h1 {
        margin: 0;
        font-size: 1.2rem;
        line-height: 1.2;
      }

      .brand small {
        color: var(--subtle);
      }

      .nav-list { display: grid; gap: 10px; }

      .nav-btn {
        width: 100%;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: var(--muted);
        padding: 12px 14px;
        text-align: left;
        cursor: pointer;
        font-weight: 700;
        font-size: 0.95rem;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
      }

      .nav-btn:hover {
        background: rgba(255,255,255,0.03);
        border-color: var(--line);
        transform: translateX(2px);
      }

      .nav-btn.active {
        background: linear-gradient(135deg, rgba(155,125,255,0.15), rgba(127,229,192,0.08));
        border-color: var(--line);
        color: var(--text);
      }

      .sidebar-box h3 {
        margin: 0 0 12px;
        font-size: 0.8rem;
        color: var(--subtle);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .teacher-qrcode {
        width: 185px;
        height: 185px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--line);
        border-radius: 18px;
        display: grid;
        place-items: center;
        overflow: hidden;
        margin: 0 auto 10px;
      }

      .teacher-qrcode img,
      #dashboardQr img,
      #studentQrBox img {
        display: block;
        width: 100%;
        height: 100%;
      }

      .class-code {
        background: rgba(127,229,192,0.08);
        border: 1px solid rgba(127,229,192,0.35);
        border-radius: 12px;
        padding: 10px 12px;
        text-align: center;
        color: var(--success);
        font-weight: 700;
        letter-spacing: 0.08em;
        word-break: break-all;
      }

      .content {
        background: rgba(17,14,34,0.72);
        border: 1px solid rgba(185,148,255,0.26);
        border-radius: 30px;
        box-shadow: 0 24px 58px rgba(63,39,92,0.34);
        padding: 18px 18px 22px;
      }

      .view { display: grid; gap: 20px; }

      .view-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }

      .view-header h2 {
        margin: 0;
        font-size: 1.9rem;
      }

      .panel-box {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 18px;
      }

      .panel-box h3 { margin-top: 0; }

      .hero-lettering {
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(223, 254, 242, 0.8);
        font-size: 0.72rem;
      }

      .teacher-name-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        width: 100%;
        padding: 18px 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(155,125,255,0.18), rgba(127,229,192,0.12));
        border: 1px solid rgba(255,255,255,0.12);
      }

      .teacher-name-header h2 {
        margin: 6px 0 0;
        font-size: clamp(1.5rem, 2vw, 2.3rem);
        line-height: 1.1;
      }

      .teacher-name-header .header-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--mint);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .subject-glow-card {
        display: grid;
        gap: 18px;
        width: 100%;
        text-align: left;
        padding: 22px;
        border-radius: 26px;
        border: 1px solid rgba(148, 122, 255, 0.4);
        background:
          linear-gradient(135deg, rgba(155,125,255,0.22), rgba(127,229,192,0.12)),
          rgba(19, 14, 32, 0.8);
        color: var(--text);
        box-shadow: 0 18px 40px rgba(88, 58, 160, 0.28);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }

      .subject-glow-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 22px 48px rgba(95, 167, 146, 0.2);
        border-color: rgba(127,229,192,0.5);
      }

      .subject-glow-top,
      .subject-glow-meta,
      .announcement-meta,
      .composer-header,
      .subject-hero-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .subject-chip,
      .stat-pill,
      .type-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.68rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .subject-chip {
        background: rgba(255,255,255,0.08);
        color: var(--mint);
      }

      .stat-pill {
        background: rgba(127,229,192,0.12);
        color: var(--success);
        border: 1px solid rgba(127,229,192,0.2);
      }

      .subject-glow-card h3 {
        margin: 0;
        font-size: 1.6rem;
      }

      .subject-glow-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .subject-glow-meta {
        color: var(--subtle);
        font-size: 0.76rem;
      }

      .subject-glow-bar {
        height: 5px;
        border-radius: 999px;
        background: linear-gradient(90deg, rgba(155,125,255,1), rgba(127,229,192,0.9));
      }

      .subject-hero {
        background: linear-gradient(135deg, rgba(155,125,255,0.18), rgba(127,229,192,0.08));
      }

      .announcement-split {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
        margin-top: 18px;
      }

      .announcement-column {
        display: grid;
        gap: 14px;
        padding: 18px;
        min-height: 180px;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      }

      .announcement-column + .announcement-column {
        border-top: 1px solid rgba(157,247,212,0.35);
        border-left: 1px solid rgba(255,255,255,0.12);
        background: linear-gradient(180deg, rgba(157,247,212,0.03), rgba(255,255,255,0.01));
      }

      .announcement-list-panel {
        display: grid;
        gap: 14px;
      }

      .announcement-item {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 14px 16px;
        display: grid;
        gap: 12px;
      }

      .type-badge {
        background: rgba(155,125,255,0.16);
        color: var(--mint);
        border: 1px solid rgba(155,125,255,0.26);
      }

      .announcement-head {
        margin-bottom: 2px;
      }

      .announcement-item h4 {
        margin: 0;
        font-size: 1.02rem;
        line-height: 1.4;
        letter-spacing: 0.01em;
      }

      .announcement-item p {
        margin: 0;
        color: var(--muted);
        line-height: 1.75;
        font-size: 0.93rem;
      }

      .announcement-meta {
        color: var(--subtle);
        font-size: 0.72rem;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 12px;
        align-items: center;
        margin-top: 2px;
      }

      .announcement-meta span {
        display: block;
      }

      .announcement-image-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .announcement-image-grid img {
        width: 100%;
        height: 88px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
        cursor: pointer;
        transition: transform 0.18s ease, border-color 0.18s ease;
      }

      .announcement-image-grid img:hover {
        transform: translateY(-1px);
        border-color: rgba(155,125,255,0.5);
      }

      .announcement-image-viewer {
        width: min(820px, 90vw);
        max-height: 82vh;
        background: rgba(18,13,32,0.98);
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 16px;
        display: grid;
        gap: 12px;
      }

      .announcement-image-viewer img {
        width: 100%;
        max-height: 72vh;
        object-fit: contain;
        border-radius: 16px;
        background: rgba(255,255,255,0.02);
      }

      .announcement-composer {
        position: fixed;
        right: 28px;
        bottom: 28px;
        width: min(460px, calc(100vw - 32px));
        background: rgba(17, 14, 34, 0.98);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        padding: 18px;
        z-index: 80;
      }

      .composer-header {
        margin-bottom: 12px;
      }

      .preview-list {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }

      .preview-list img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 12px;
        border: 1px solid var(--line);
      }

      form { display: grid; gap: 14px; }
      .two-col {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      label {
        display: grid;
        gap: 7px;
        font-size: 0.82rem;
        color: var(--muted);
        font-weight: 600;
      }

      input, textarea, select, button { font: inherit; }
      input, textarea, select {
        width: 100%;
        padding: 12px 13px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.06);
        color: var(--text);
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      .primary-btn,
      .secondary-btn,
      .small-btn,
      .danger-btn,
      .icon-close {
        border: none;
        border-radius: 12px;
        cursor: pointer;
      }

      .primary-btn,
      .secondary-btn,
      .small-btn,
      .danger-btn {
        padding: 10px 14px;
        font-weight: 700;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--violet), var(--green));
        color: #111827;
      }

      .secondary-btn {
        background: rgba(255,255,255,0.06);
        color: var(--text);
        border: 1px solid var(--line);
      }

      .danger-btn {
        background: rgba(255,127,157,0.12);
        color: #ffd8e1;
        border: 1px solid rgba(255,127,157,0.25);
      }

      .small-btn {
        padding: 8px 12px;
        font-size: 0.75rem;
      }

      .small-btn.primary { background: rgba(155,125,255,0.15); color: var(--text); border: 1px solid rgba(155,125,255,0.35); }
      .small-btn.success { background: rgba(127,229,192,0.12); color: var(--success); border: 1px solid rgba(127,229,192,0.3); }
      .small-btn.warning { background: rgba(255,215,124,0.12); color: var(--warning); border: 1px solid rgba(255,215,124,0.25); }
      .small-btn.danger { background: rgba(255,127,157,0.1); color: #ffdfe7; border: 1px solid rgba(255,127,157,0.25); }

      .subject-grid,
      .dashboard-grid {
        display: grid;
        gap: 18px;
      }

      .subject-grid { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }

      .subject-card {
        background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
        border: 1px solid var(--line);
        border-radius: 22px;
        padding: 18px;
        display: grid;
        gap: 14px;
      }

      .subject-top,
      .subject-meta,
      .announcement-head,
      .announcement-foot,
      .section-title,
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .subject-course {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        background: rgba(155,125,255,0.16);
        border: 1px solid rgba(155,125,255,0.3);
        color: var(--mint);
        padding: 7px 10px;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .subject-card h3,
      .announcement-card h4,
      .section-title h4 { margin: 0; }

      .subject-card p,
      .announcement-card p,
      .empty-state {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .subject-meta {
        font-size: 0.76rem;
        color: var(--subtle);
      }

      .subject-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .announcement-list {
        display: grid;
        gap: 12px;
      }

      .announcement-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
      }

      .announcement-card.done { opacity: 0.8; }

      .announcement-tag {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 0.68rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 700;
      }

      .announcement-tag.active {
        background: rgba(127,229,192,0.12);
        color: var(--success);
        border: 1px solid rgba(127,229,192,0.25);
      }

      .announcement-tag.done {
        background: rgba(255,215,124,0.12);
        color: var(--warning);
        border: 1px solid rgba(255,215,124,0.25);
      }

      .announcement-foot {
        color: var(--subtle);
        font-size: 0.72rem;
        margin-top: 10px;
      }

      .divider {
        height: 1px;
        background: linear-gradient(90deg, rgba(127,229,192,0.25), rgba(155,125,255,0.7), rgba(255,255,255,0));
        margin: 10px 0;
      }

      .empty-state {
        padding: 20px;
        border: 1px dashed var(--line);
        border-radius: 18px;
        text-align: center;
        background: rgba(255,255,255,0.02);
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(10,8,18,0.62);
        display: grid;
        place-items: center;
        z-index: 30;
        padding: 24px;
      }

      .modal-card {
        width: min(560px, 100%);
        background: rgba(18,13,32,0.98);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 24px 70px rgba(18,10,28,0.7);
        padding: 22px;
      }

      .icon-close {
        width: 35px;
        height: 35px;
        background: rgba(255,255,255,0.05);
        border: 1px solid var(--line);
        color: var(--text);
        font-size: 1.2rem;
      }

      #dashboardQr,
      #studentQrBox {
        width: 220px;
        height: 220px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 18px;
        display: grid;
        place-items: center;
        padding: 10px;
      }

      #burgerMenu {
        position: fixed;
        top: 18px;
        right: 18px;
        z-index: 50;
        width: 48px;
        height: 48px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(16,14,32,0.9);
        color: #fff;
        font-size: 1.2rem;
        cursor: pointer;
        display: block;
      }

      .teacher-shell #burgerMenu {
        display: block;
      }

      .mobile-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(10, 8, 18, 0.48);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 35;
      }

      .mobile-backdrop.show {
        opacity: 1;
        pointer-events: auto;
      }

      @media (max-width: 980px) {
        body { padding: 0; }
        .app-shell {
          width: calc(100vw - 12px);
        }
        .content {
          padding: 14px 14px 18px;
        }
        .sidebar {
          top: 10px;
          bottom: 10px;
          right: 12px;
          width: min(82vw, 320px);
          min-height: auto;
          border-radius: 24px;
          padding: 18px 14px;
          gap: 16px;
        }

        .brand h1 { font-size: 1.05rem; }
        .sidebar-box { padding: 14px; }
        #burgerMenu { display: block; }
      }

      @media (max-width: 640px) {
        .two-col { grid-template-columns: 1fr; }
        .view-header { display: grid; }
        .content { padding: 18px 14px; }
        .panel-box { padding: 14px; }
      }
    </style>
  </head>
  <body>
    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <div id="appShell" class="app-shell">
      <div id="mobileBackdrop" class="mobile-backdrop"></div>

      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">C</div>
          <div>
            <h1>Class Announcement</h1>
            <small>Manage</small>
          </div>
        </div>

        <div class="sidebar-box">
          <h3>Menu</h3>
          <div class="nav-list">
            <button class="nav-btn active" type="button" data-view="manage">Manage</button>
            <button class="nav-btn" type="button" data-view="create">Create Subject</button>
            <button class="nav-btn" type="button" data-view="dashboard">Dashboard</button>
            <button class="nav-btn" type="button" data-view="about">About Me</button>
          </div>
        </div>
      </aside>

      <main class="content">
        <section id="manageView" class="view">
          <div class="view-header">
            <h2>Manage</h2>
            <button id="manageAddSubjectBtn" type="button" class="primary-btn">+ Create subject</button>
          </div>
          <div id="manageSubjectGrid" class="subject-grid"></div>
        </section>

        <section id="createView" class="view hidden">
