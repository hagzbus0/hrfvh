    <script>
      window.APP_DB_CONFIG = {
        provider: 'firebase',
        firebaseDbPath: 'cassy_app',
        firebaseConfig: {
          apiKey: 'YOUR_API_KEY',
          authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
          databaseURL: 'https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com',
          projectId: 'YOUR_PROJECT_ID',
          storageBucket: 'YOUR_PROJECT_ID.appspot.com',
          messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
          appId: 'YOUR_APP_ID'
        }
      };
    </script>
    <script src="./db.js"></script>
    <script src="./qrcode.min.js"></script>
    <script>
      const STORAGE_KEYS = {
        teacher: 'cassy_teacher_profile',
        subjects: 'cassy_subjects'
      };

      const defaultTeacher = {
        id: 'teacher-default',
        name: 'Ms. Reyes',
        position: 'Class Adviser',
        className: 'Grade 7 - STEM',
        email: 'teacher@school.edu',
        phone: '0912-345-6789',
        bio: 'Guiding students with clear updates, reminders, and weekly learning goals.',
        classCode: 'CASSY-7STEM42',
        school: 'CASSY Academy'
      };

      const state = {
        currentTeacher: null,
        currentView: 'dashboard',
        selectedSubjectId: null,
        subjectScheduleDraft: [],
        sharedSubjects: {},
        pendingAnnouncementImages: [],
        pendingSubjectAnnouncementImages: []
      };

      function getTeacher() {
        return state.currentTeacher || defaultTeacher;
      }

      function saveTeacher(data) {
        state.currentTeacher = data;
        const config = window.APP_DB_CONFIG || {};
        const remoteProviders = ['firebase', 'supabase'];

        if (window.CASSY_DB && remoteProviders.includes((config.provider || '').toLowerCase())) {
          window.CASSY_DB.saveTeacher(data);
          return;
        }

        console.warn('No Firebase/Supabase configuration was found, so teacher data is not being saved remotely.');
      }

      function getSubjects() {
        if (Object.keys(state.sharedSubjects || {}).length) {
          return state.sharedSubjects;
        }
        return {};
      }

      function saveSubjects(data) {
        state.sharedSubjects = data || {};
        const config = window.APP_DB_CONFIG || {};
        const remoteProviders = ['firebase', 'supabase'];

        if (window.CASSY_DB && remoteProviders.includes((config.provider || '').toLowerCase())) {
          window.CASSY_DB.saveSubjects(data || {});
          return;
        }

        console.warn('No Firebase/Supabase configuration was found, so subject data is not being saved remotely.');
      }

      async function hydrateSharedState() {
        const config = window.APP_DB_CONFIG || {};
        const remoteProviders = ['firebase', 'supabase'];

        if (remoteProviders.includes((config.provider || '').toLowerCase()) && window.CASSY_DB) {
          try {
            state.currentTeacher = (await window.CASSY_DB.getTeacher()) || defaultTeacher;
            state.sharedSubjects = (await window.CASSY_DB.getSubjects()) || {};
            return;
          } catch (error) {
            console.warn('Remote data hydration failed.', error);
          }
        }

        state.currentTeacher = defaultTeacher;
        state.sharedSubjects = {};
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function formatDate(dateString) {
        if (!dateString) return 'No deadline';
        const d = new Date(dateString);
        return isNaN(d) ? dateString : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function formatDateTime(dateString) {
        if (!dateString) return 'No schedule';
        const d = new Date(dateString);
        return isNaN(d) ? dateString : d.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
      }

      function getTeacherSubjects() {
        return getSubjects()[state.currentTeacher.id] || [];
      }

      function saveTeacherSubjects(list) {
        const all = getSubjects();
        all[state.currentTeacher.id] = list;
        saveSubjects(all);
      }

      function getSubjectById(subjectId) {
        return getTeacherSubjects().find((item) => item.id === subjectId) || null;
      }

      function formatScheduleSummary(schedules) {
        if (!Array.isArray(schedules) || !schedules.length) return 'No class schedule added yet.';
        return schedules.map((entry) => `${entry.day}: ${entry.timeIn} - ${entry.timeOut}`).join(' • ');
      }

      async function readFilesAsDataUrls(files) {
        const fileList = Array.from(files || []).slice(0, 3);
        if (!fileList.length) return [];

        return Promise.all(fileList.map((file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(file);
        })));
      }

      function clearAnnouncementDrafts() {
        state.pendingAnnouncementImages = [];
        state.pendingSubjectAnnouncementImages = [];
      }

      function renderSubjectScheduleDraft() {
        const rows = document.getElementById('subjectScheduleRows');
        if (!rows) return;

        if (!state.subjectScheduleDraft.length) {
          rows.innerHTML = '<div class="empty-state">No class schedule added yet.</div>';
          return;
        }

        rows.innerHTML = state.subjectScheduleDraft.map((entry, index) => `
          <div class="schedule-row" style="display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background: rgba(255,255,255,0.03);">
            <span>${escapeHtml(entry.day)} • ${escapeHtml(entry.timeIn)} - ${escapeHtml(entry.timeOut)}</span>
            <button type="button" class="small-btn danger" data-remove-schedule="${index}">Remove</button>
          </div>
        `).join('');
      }

      function renderEditScheduleDraft(schedules) {
        const rows = document.getElementById('subjectEditScheduleRows');
        if (!rows) return;

        if (!Array.isArray(schedules) || !schedules.length) {
          rows.innerHTML = '<div class="empty-state">No class schedule added yet.</div>';
          return;
        }

        rows.innerHTML = schedules.map((entry, index) => `
          <div class="schedule-row" style="display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:12px; background: rgba(255,255,255,0.03);">
            <span>${escapeHtml(entry.day)} • ${escapeHtml(entry.timeIn)} - ${escapeHtml(entry.timeOut)}</span>
            <button type="button" class="small-btn danger" data-remove-edit-schedule="${index}">Remove</button>
          </div>
        `).join('');
      }

      function addScheduleDraft() {
        const day = document.getElementById('subjectScheduleDay').value;
        const timeIn = document.getElementById('subjectScheduleIn').value;
        const timeOut = document.getElementById('subjectScheduleOut').value;

        if (!day || !timeIn || !timeOut) {
          alert('Please complete the day and time values for the class schedule.');
          return;
        }

        const idx = state.subjectScheduleDraft.findIndex((entry) => entry.day === day);
        if (idx >= 0) {
          state.subjectScheduleDraft[idx] = { day, timeIn, timeOut };
        } else {
          state.subjectScheduleDraft.push({ day, timeIn, timeOut });
        }

        renderSubjectScheduleDraft();
      }

      function addEditScheduleDraft() {
        const day = document.getElementById('subjectEditScheduleDay').value;
        const timeIn = document.getElementById('subjectEditScheduleIn').value;
        const timeOut = document.getElementById('subjectEditScheduleOut').value;

        if (!day || !timeIn || !timeOut) {
          alert('Please complete the day and time values for the class schedule.');
          return;
        }

        const schedules = (document.getElementById('subjectEditId') && document.getElementById('subjectEditId').dataset.scheduleDraft)
          ? JSON.parse(document.getElementById('subjectEditId').dataset.scheduleDraft)
          : [];

        const idx = schedules.findIndex((entry) => entry.day === day);
        if (idx >= 0) {
          schedules[idx] = { day, timeIn, timeOut };
        } else {
          schedules.push({ day, timeIn, timeOut });
        }

        document.getElementById('subjectEditId').dataset.scheduleDraft = JSON.stringify(schedules);
        renderEditScheduleDraft(schedules);
      }

      function getAnnouncementStatus(item) {
        const deadline = new Date(item.deadlineDateTime || item.deadline || '2099-12-31T23:59');
        return deadline > new Date() ? 'active' : 'completed';
      }

      function getSortedAnnouncements(subject) {
        const all = (subject.announcements || []).slice();
        const active = all.filter((item) => getAnnouncementStatus(item) === 'active').sort((a, b) => new Date(a.deadlineDateTime || a.deadline || '2099-12-31T23:59') - new Date(b.deadlineDateTime || b.deadline || '2099-12-31T23:59'));
        const completed = all.filter((item) => getAnnouncementStatus(item) === 'completed').sort((a, b) => new Date(a.deadlineDateTime || a.deadline || '2099-12-31T23:59') - new Date(b.deadlineDateTime || b.deadline || '2099-12-31T23:59'));
        return { active, completed };
      }

      function ensureDefaultTeacher() {
        const teacher = getTeacher();
        state.currentTeacher = teacher;
        saveTeacher(teacher);
      }

      function ensureDefaultSubjects() {
        const all = getSubjects();
        if (!all[state.currentTeacher.id]) {
          all[state.currentTeacher.id] = [
            {
              id: 'subject-math',
              name: 'Mathematics',
              course: 'Grade 7 - A',
              access: 'Grade 7, STEM, All students',
              description: 'Basic equations, practice drills, and weekly review tasks.',
              color: 'purple',
              announcements: [
                {
                  id: 'ann-1',
                  title: 'Quiz 1 Review',
                  announcementType: 'activity',
                  details: 'Review fractions, decimals, and word problems. Bring your notebook and calculator.',
                  startDateTime: '2026-09-20T08:00',
                  deadlineDateTime: '2026-09-25T17:00',
                  images: [],
                  status: 'active'
                },
                {
                  id: 'ann-2',
                  title: 'Seatwork Tracker',
                  announcementType: 'reminder',
                  details: 'Submit the seatwork folder before the end of the day.',
                  startDateTime: '2026-09-17T08:00',
                  deadlineDateTime: '2026-09-18T15:00',
                  images: [],
                  status: 'completed'
                }
              ]
            },
            {
              id: 'subject-science',
              name: 'Science',
              course: 'Grade 7 - A',
              access: 'Grade 7, STEM, All students',
              description: 'Lab instructions, safety reminders, and observation notes.',
              color: 'green',
              announcements: [
                {
                  id: 'ann-3',
                  title: 'Lab Experiment',
                  announcementType: 'activity',
                  details: 'Bring your lab gown and complete the observation sheet before Friday.',
                  startDateTime: '2026-09-22T09:00',
                  deadlineDateTime: '2026-09-27T14:00',
                  images: [],
                  status: 'active'
                },
                {
                  id: 'ann-4',
                  title: 'Safety Reminder',
                  announcementType: 'reminder',
                  details: 'Review proper handling of glass materials before the experiment.',
                  startDateTime: '2026-09-10T08:00',
                  deadlineDateTime: '2026-09-10T12:00',
                  images: [],
                  status: 'completed'
                }
              ]
            }
          ];
          saveSubjects(all);
        }
      }

      function renderTeacherInfo() {
        const teacherName = document.getElementById('teacherNameLabel');
        const teacherClass = document.getElementById('teacherClassLabel');
        if (teacherName) teacherName.textContent = state.currentTeacher.name;
        if (teacherClass) teacherClass.textContent = state.currentTeacher.className;
      }

      function renderManageView() {
        const subjects = getTeacherSubjects();

        if (!subjects.length) {
          document.getElementById('manageSubjectGrid').innerHTML = '<div class="empty-state">No subjects yet. Create one to begin managing your class announcements.</div>';
          return;
        }

        document.getElementById('manageSubjectGrid').innerHTML = subjects.map((subject) => {
          const { active, completed } = getSortedAnnouncements(subject);
          const next = active[0] || completed[0];
          return `
            <article class="subject-card" data-open-subject="${subject.id}" style="cursor:pointer;" tabindex="0" role="button" aria-label="Open ${escapeHtml(subject.name)}">
              <div class="subject-top">
                <span class="subject-course">${escapeHtml(subject.course)}</span>
                <span style="color: var(--subtle); font-size: 0.75rem;">${active.length} active</span>
              </div>
              <div>
                <h3>${escapeHtml(subject.name)}</h3>
                <p>${escapeHtml(subject.description || 'No short description added yet.')}</p>
              </div>
              <div class="subject-meta">
                <span>${(subject.announcements || []).length} items</span>
              </div>
              <div class="panel-box" style="padding:12px;">
                <div style="color: var(--subtle); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Next deadline</div>
                <strong>${next ? formatDateTime(next.deadlineDateTime || next.deadline) : 'No upcoming deadline'}</strong>
              </div>
              <div class="subject-actions">
                <button class="small-btn warning" type="button" data-edit-subject="${subject.id}">Edit</button>
                <button class="small-btn danger" type="button" data-delete-subject="${subject.id}">Delete</button>
              </div>
            </article>
          `;
        }).join('');
      }

      function renderCreateView() {
        const subjects = getTeacherSubjects();

        if (!subjects.length) {
          document.getElementById('createdSubjectsList').innerHTML = '<div class="empty-state">No subjects created yet.</div>';
          return;
        }

        document.getElementById('createdSubjectsList').innerHTML = subjects.map((subject) => `
          <article class="subject-card" data-open-subject="${subject.id}" style="cursor:pointer;" tabindex="0" role="button" aria-label="Open ${escapeHtml(subject.name)}">
            <div class="subject-top">
              <span class="subject-course">${escapeHtml(subject.course || subject.code || 'Subject')}</span>
              <div class="subject-actions">
                <button class="small-btn warning" type="button" data-edit-subject="${subject.id}">Edit</button>
                <button class="small-btn danger" type="button" data-delete-subject="${subject.id}">Delete</button>
              </div>
            </div>
            <div>
              <h3>${escapeHtml(subject.name)}</h3>
              <p style="margin: 8px 0 0; color: var(--muted);"><strong>Code:</strong> ${escapeHtml(subject.code || 'N/A')}</p>
              <p style="margin: 6px 0 0; color: var(--muted);">${escapeHtml(subject.description || 'No short description added yet.')}</p>
            </div>
          </article>
        `).join('');
      }

      function renderDashboardPreview() {
        const subjects = getTeacherSubjects();

        if (!subjects.length) {
          document.getElementById('dashboardPreview').innerHTML = '<div class="empty-state">No subjects available for the dashboard preview.</div>';
          return;
        }

        const top = `
          <div class="panel-box" style="grid-column: 1 / -1;">
            <div class="teacher-name-header">
              <div>
                <div class="hero-lettering">Class dashboard</div>
                <h2>${escapeHtml(state.currentTeacher.name || 'Teacher')}</h2>
              </div>
              <div class="header-badge">${escapeHtml(state.currentTeacher.position || 'Teacher')}</div>
            </div>
          </div>
        `;

        const list = subjects.map((subject) => {
          const { active, completed } = getSortedAnnouncements(subject);
          return `
            <button class="subject-glow-card" type="button" data-open-subject="${subject.id}">
              <div class="subject-glow-top">
                <span class="subject-chip">${escapeHtml(subject.course)}</span>
                <span class="stat-pill">${active.length} active</span>
              </div>
              <div>
                <h3>${escapeHtml(subject.name)}</h3>
                <p>${escapeHtml(subject.description || 'No short description added yet.')}</p>
              </div>
              <div class="subject-glow-meta">
                <span>${(subject.announcements || []).length} total</span>
              </div>
              <div class="subject-glow-meta">
                <span>${completed.length} completed</span>
                <span>${active.length} ongoing</span>
              </div>
              <div class="subject-glow-bar"></div>
            </button>
          `;
        }).join('');

        document.getElementById('dashboardPreview').innerHTML = top + list;
      }

      function renderAnnouncementCard(announcement, subjectId) {
        const type = announcement.announcementType || 'reminder';
        const status = getAnnouncementStatus(announcement);
        const images = Array.isArray(announcement.images) ? announcement.images : [];
        return `
          <article class="announcement-item">
            <div class="announcement-head">
              <span class="type-badge">${escapeHtml(type)}</span>
              <span class="announcement-tag ${status === 'completed' ? 'done' : 'active'}">${status === 'completed' ? 'Completed' : 'Active'}</span>
            </div>
            <h4>${escapeHtml(announcement.title)}</h4>
            <p>${escapeHtml(announcement.details)}</p>
            <div class="announcement-meta">
              <span>Start: ${formatDateTime(announcement.startDateTime || announcement.deadlineDateTime)}</span>
              <span>Deadline: ${formatDateTime(announcement.deadlineDateTime || announcement.deadline)}</span>
            </div>
            ${images.length ? `
              <div class="announcement-image-grid">
                ${images.slice(0, 3).map((image) => `<img src="${image}" alt="announcement preview" data-open-announcement-image="${image}" />`).join('')}
              </div>
            ` : ''}
            <div class="subject-actions">
              <button class="small-btn warning" type="button" data-edit-announcement="${announcement.id}" data-subject-id="${subjectId}">Edit</button>
              <button class="small-btn danger" type="button" data-delete-announcement="${announcement.id}" data-subject-id="${subjectId}">Delete</button>
            </div>
          </article>
        `;
      }

      function renderSubjectDetailPage() {
        const subject = getSubjectById(state.selectedSubjectId);
        const view = document.getElementById('subjectDetailView');

        if (!subject) {
          view.innerHTML = '<div class="empty-state">No subject selected.</div>';
          return;
        }

        const { active, completed } = getSortedAnnouncements(subject);
        view.innerHTML = `
          <div class="view-header">
            <div>
              <div style="color: var(--subtle); text-transform: uppercase; letter-spacing: 0.08em; font-size:0.72rem;">Subject details</div>
              <h2 style="margin: 6px 0 0; font-size: 1.8rem;">${escapeHtml(subject.name)}</h2>
            </div>
            <button id="openAddAnnouncementComposerBtn" class="primary-btn" type="button">+ Add announcement</button>
          </div>

          <div class="panel-box subject-hero">
            <div class="subject-hero-head">
              <span class="subject-chip">${escapeHtml(subject.course || subject.code)}</span>
              <span class="stat-pill">${(subject.announcements || []).length} entries</span>
            </div>
            <div>
              <p style="margin: 0 0 8px; color: var(--muted);">${escapeHtml(subject.description || 'No short description added yet.')}</p>
            </div>
            <div class="subject-glow-meta">
              <span>${active.length} active</span>
              <span>${completed.length} completed</span>
            </div>
          </div>

          <div class="panel-box" style="margin: 18px 0 12px;">
            <div class="section-title"><h3>Class schedule</h3></div>
            <p style="margin: 10px 0 0; color: var(--muted);">${escapeHtml(formatScheduleSummary(subject.schedules || []))}</p>
          </div>

          <div class="announcement-split">
            <div class="announcement-column">
              <div class="section-title"><h3>Active</h3></div>
              <div class="announcement-list-panel">
                ${active.length ? active.map((item) => renderAnnouncementCard(item, subject.id)).join('') : '<div class="empty-state">No active announcements yet.</div>'}
              </div>
            </div>

            <div class="announcement-column">
              <div class="section-title"><h3>Completed</h3></div>
              <div class="announcement-list-panel">
                ${completed.length ? completed.map((item) => renderAnnouncementCard(item, subject.id)).join('') : '<div class="empty-state">No completed announcements yet.</div>'}
              </div>
            </div>
          </div>

          <div id="announcementComposer" class="announcement-composer hidden">
            <div class="composer-header">
              <h3 style="margin:0;">Add announcement</h3>
              <button id="closeAnnouncementComposerBtn" class="icon-close" type="button">×</button>
            </div>
            <form id="subjectAnnouncementForm">
              <label>
                Announcement title
                <input type="text" id="subjectAnnouncementTitleInput" required />
              </label>

              <div class="two-col">
                <label>
                  Announcement type
                  <select id="subjectAnnouncementTypeInput">
                    <option value="reminder">Reminder</option>
                    <option value="activity">Activity</option>
                  </select>
                </label>
                <label>
                  Schedule date & time
                  <input type="datetime-local" id="subjectAnnouncementStartInput" required />
                </label>
              </div>

              <label>
                Description
                <textarea id="subjectAnnouncementDescriptionInput" required></textarea>
              </label>

              <label>
                File upload (max 3 files)
                <input type="file" id="subjectAnnouncementImagesInput" accept="image/*" multiple />
              </label>

              <div id="subjectAnnouncementPreviewList" class="preview-list"></div>

              <label>
                Deadline date & time
                <input type="datetime-local" id="subjectAnnouncementDeadlineInput" required />
              </label>

              <button type="submit" class="primary-btn">Save announcement</button>
            </form>
          </div>
        `;

        const addBtn = document.getElementById('openAddAnnouncementComposerBtn');
        const closeBtn = document.getElementById('closeAnnouncementComposerBtn');
        const fileInput = document.getElementById('subjectAnnouncementImagesInput');
        const form = document.getElementById('subjectAnnouncementForm');

        addBtn.addEventListener('click', () => {
          document.getElementById('announcementComposer').classList.remove('hidden');
        });

        closeBtn.addEventListener('click', () => {
          document.getElementById('announcementComposer').classList.add('hidden');
          form.reset();
          document.getElementById('subjectAnnouncementPreviewList').innerHTML = '';
        });

        fileInput.addEventListener('change', async (event) => {
          const preview = document.getElementById('subjectAnnouncementPreviewList');
          const images = await readFilesAsDataUrls(event.target.files);
          state.pendingSubjectAnnouncementImages = images;
          preview.innerHTML = images.map((src) => `<img src="${src}" alt="assignment attachment" />`).join('');
        });

        form.addEventListener('submit', async (event) => {
          event.preventDefault();

          const images = state.pendingSubjectAnnouncementImages.length
            ? state.pendingSubjectAnnouncementImages.slice()
            : await readFilesAsDataUrls(fileInput.files);

          const title = document.getElementById('subjectAnnouncementTitleInput').value.trim();
          const announcementType = document.getElementById('subjectAnnouncementTypeInput').value;
          const details = document.getElementById('subjectAnnouncementDescriptionInput').value.trim();
          const startDateTime = document.getElementById('subjectAnnouncementStartInput').value;
          const deadlineDateTime = document.getElementById('subjectAnnouncementDeadlineInput').value;

          if (!title || !details || !startDateTime || !deadlineDateTime) {
            alert('Please complete all fields for the announcement.');
            return;
          }

          const list = getTeacherSubjects();
          const selectedSubject = list.find((item) => item.id === state.selectedSubjectId) || getSubjectById(state.selectedSubjectId);
          if (!selectedSubject) return;

          const item = {
            id: crypto.randomUUID(),
            title,
            announcementType,
            details,
            startDateTime,
            deadlineDateTime,
            images,
            createdAt: new Date().toISOString(),
            status: 'active'
          };

          const index = list.findIndex((item) => item.id === selectedSubject.id);
          if (index >= 0) {
            list[index] = {
              ...selectedSubject,
              announcements: [item, ...(selectedSubject.announcements || [])]
            };
          }

          saveTeacherSubjects(list);
          form.reset();
          fileInput.value = '';
          state.pendingSubjectAnnouncementImages = [];
          document.getElementById('subjectAnnouncementPreviewList').innerHTML = '';
          document.getElementById('announcementComposer').classList.add('hidden');
          renderAll();
        });
      }

      function showToast(message, type = 'success') {
        const container = document.getElementById('toastContainer');
        if (!container) return;

        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span>✓</span><span>${escapeHtml(message)}</span>`;
        container.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add('show'));

        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 220);
        }, 2200);
      }

      function openAnnouncementImageViewer(imageSrc) {
        const modal = document.getElementById('imageViewerModal');
        const image = document.getElementById('imageViewerImage');
        if (!modal || !image || !imageSrc) return;

        image.src = imageSrc;
        modal.classList.remove('hidden');
        modal.setAttribute('aria-hidden', 'false');
      }

      function closeAnnouncementImageViewer() {
        const modal = document.getElementById('imageViewerModal');
        const image = document.getElementById('imageViewerImage');
        if (!modal || !image) return;

        image.src = '';
        modal.classList.add('hidden');
        modal.setAttribute('aria-hidden', 'true');
      }

      function buildPublicDashboardUrl(classCode = state.currentTeacher.classCode) {
        const url = new URL(window.location.href);
        url.searchParams.set('code', classCode);
        url.hash = '';
        return url.toString();
      }

      function renderAboutMe() {
        const teacher = state.currentTeacher;
        document.getElementById('aboutMeView').innerHTML = `
          <div class="view-header"><h2>About Me</h2></div>
          <div class="panel-box">
            <div style="display:grid; place-items:center; gap:12px; margin-bottom: 18px;">
              <div id="aboutMeQrDisplay" class="teacher-qrcode"></div>
              <div class="class-code" style="max-width: 360px;">${teacher.classCode}</div>
              <div style="display:flex; gap:10px; width:min(320px,100%); flex-wrap:wrap; justify-content:center;">
                <button id="copyCodeBtn" type="button" class="secondary-btn" style="flex:1; min-width: 130px;">Copy class code</button>
                <button id="downloadQrBtn" type="button" class="secondary-btn" style="flex:1; min-width: 130px;">Download PNG</button>
                <button id="shareQrBtn" type="button" class="secondary-btn" style="flex:1; min-width: 130px;">Share QR</button>
              </div>
            </div>

            <form id="teacherProfileForm">
              <div class="two-col">
                <label>
                  Full name
                  <input type="text" id="teacherProfileName" value="${escapeHtml(teacher.name)}" required />
                </label>
                <label>
                  Teacher of what course
                  <input type="text" id="teacherProfileClassName" value="${escapeHtml(teacher.className || teacher.position || 'Teacher')}" required />
                </label>
              </div>

              <div class="two-col">
                <label>
                  Position
                  <input type="text" id="teacherProfilePosition" value="${escapeHtml(teacher.position || 'Class Adviser')}" required />
                </label>
                <label>
                  School
                  <input type="text" id="teacherProfileSchool" value="${escapeHtml(teacher.school || 'CASSY Academy')}" required />
                </label>
              </div>

              <button type="submit" class="primary-btn" style="margin-top:12px;">Save profile</button>
            </form>
          </div>
        `;

        const qr = qrcode(0, 'M');
        qr.addData(buildPublicDashboardUrl(teacher.classCode));
        qr.make();
        const qrDisplay = document.getElementById('aboutMeQrDisplay');
        qrDisplay.innerHTML = qr.createImgTag(8, 8, 'teacher-qr');

        document.getElementById('copyCodeBtn').addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(state.currentTeacher.classCode);
            const btn = document.getElementById('copyCodeBtn');
            btn.textContent = 'Copied';
            showToast('Class code copied.');
            setTimeout(() => { btn.textContent = 'Copy class code'; }, 1200);
          } catch (error) {
            alert('Copy failed. Please copy the code manually: ' + state.currentTeacher.classCode);
          }
        });

        document.getElementById('downloadQrBtn').addEventListener('click', () => {
          const qrImage = document.querySelector('#aboutMeQrDisplay img');
          if (!qrImage) return;
          const link = document.createElement('a');
          link.href = qrImage.src;
          link.download = 'class-announcement-qr.png';
          link.click();
          showToast('QR code downloaded.');
        });

        document.getElementById('shareQrBtn').addEventListener('click', async () => {
          const qrImage = document.querySelector('#aboutMeQrDisplay img');
          if (!qrImage) return;

          try {
            const response = await fetch(qrImage.src);
            const blob = await response.blob();
            const file = new File([blob], 'class-announcement-qr.png', { type: 'image/png' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: 'Class Announcement QR',
                text: 'Scan this QR code to open the class dashboard.',
                files: [file]
              });
              showToast('QR shared successfully.');
            } else {
              const link = document.createElement('a');
              link.href = qrImage.src;
              link.download = 'class-announcement-qr.png';
              link.click();
              showToast('Sharing is not supported here, so the QR was downloaded instead.');
            }
          } catch (error) {
            showToast('Unable to share the QR right now.', 'error');
          }
        });

        document.getElementById('teacherProfileForm').addEventListener('submit', (event) => {
          event.preventDefault();
          state.currentTeacher.name = document.getElementById('teacherProfileName').value.trim();
          state.currentTeacher.className = document.getElementById('teacherProfileClassName').value.trim();
          state.currentTeacher.position = document.getElementById('teacherProfilePosition').value.trim();
          state.currentTeacher.school = document.getElementById('teacherProfileSchool').value.trim();
          saveTeacher(state.currentTeacher);
          renderAll();
          showToast('Profile information saved successfully.');
        });
      }

      function renderAll() {
        renderTeacherInfo();
        renderManageView();
        renderCreateView();
        renderDashboardPreview();
        renderSubjectDetailPage();
        renderAboutMe();
        renderSubjectScheduleDraft();
        bindSubjectActionButtons();
        bindAnnouncementActionButtons();

        const viewMap = {
          manage: document.getElementById('manageView'),
          create: document.getElementById('createView'),
          dashboard: document.getElementById('dashboardView'),
          subject: document.getElementById('subjectDetailView'),
          about: document.getElementById('aboutMeView')
        };

        Object.entries(viewMap).forEach(([key, node]) => {
          node.classList.toggle('hidden', key !== state.currentView);
        });

        document.querySelectorAll('.nav-btn').forEach((button) => {
          button.classList.toggle('active', button.dataset.view === state.currentView);
        });
      }

      function openSubjectEditor(subjectId) {
        const subject = getTeacherSubjects().find((item) => item.id === subjectId);
        if (!subject) return;

        document.getElementById('subjectEditId').value = subject.id;
        document.getElementById('subjectEditName').value = subject.name;
        document.getElementById('subjectEditCode').value = subject.code || '';
        document.getElementById('subjectEditDescription').value = subject.description || '';
        document.getElementById('subjectEditId').dataset.scheduleDraft = JSON.stringify(Array.isArray(subject.schedules) ? subject.schedules : []);
        renderEditScheduleDraft(Array.isArray(subject.schedules) ? subject.schedules : []);
        document.getElementById('subjectModal').classList.remove('hidden');
      }

      function closeSubjectEditor() {
        document.getElementById('subjectModal').classList.add('hidden');
        document.getElementById('subjectEditForm').reset();
        document.getElementById('subjectEditId').dataset.scheduleDraft = '[]';
        renderEditScheduleDraft([]);
      }

      function openAnnouncementEditor(subjectId, announcementId = '') {
        const subject = getTeacherSubjects().find((item) => item.id === subjectId);
        if (!subject) return;

        const form = document.getElementById('announcementEditForm');
        const fileInput = document.getElementById('announcementImagesInput');
        const preview = document.getElementById('announcementPreviewList');

        if (announcementId) {
          const announcement = (subject.announcements || []).find((item) => item.id === announcementId);
          if (!announcement) return;
          document.getElementById('announcementModalTitle').textContent = 'Edit announcement';
          document.getElementById('announcementEditId').value = announcement.id;
          document.getElementById('announcementTitleInput').value = announcement.title || '';
          document.getElementById('announcementTypeInput').value = announcement.announcementType || 'reminder';
          document.getElementById('announcementDetailsInput').value = announcement.details || '';
          document.getElementById('announcementStartInput').value = announcement.startDateTime || '';
          document.getElementById('announcementDeadlineInput').value = announcement.deadlineDateTime || announcement.deadline || '';
          state.pendingAnnouncementImages = Array.isArray(announcement.images) ? announcement.images.slice() : [];
          preview.innerHTML = state.pendingAnnouncementImages.length
            ? state.pendingAnnouncementImages.slice(0, 3).map((image) => `<img src="${image}" alt="announcement preview" />`).join('')
            : '';
        } else {
          document.getElementById('announcementModalTitle').textContent = 'Add announcement';
          document.getElementById('announcementEditId').value = '';
          document.getElementById('announcementTitleInput').value = '';
          document.getElementById('announcementTypeInput').value = 'reminder';
          document.getElementById('announcementDetailsInput').value = '';
          document.getElementById('announcementStartInput').value = '';
          document.getElementById('announcementDeadlineInput').value = '';
          state.pendingAnnouncementImages = [];
          preview.innerHTML = '';
        }

        fileInput.value = '';
        document.getElementById('announcementSubjectId').value = subjectId;
        document.getElementById('announcementModal').classList.remove('hidden');
      }

      function closeAnnouncementEditor() {
        document.getElementById('announcementModal').classList.add('hidden');
        document.getElementById('announcementEditForm').reset();
        document.getElementById('announcementPreviewList').innerHTML = '';
        state.pendingAnnouncementImages = [];
      }

      function createSubject(event) {
        event.preventDefault();

        const name = document.getElementById('subjectName').value.trim();
        const code = document.getElementById('subjectCode').value.trim();
        const description = document.getElementById('subjectDescription').value.trim();

        if (!name || !code || !description) {
          alert('Please fill in the subject name, code, and short description.');
          return;
        }

        const list = getTeacherSubjects();
        list.push({
          id: crypto.randomUUID(),
          name,
          code,
          course: code,
          access: '',
          description,
          color: 'purple',
          schedules: state.subjectScheduleDraft.slice(),
          announcements: []
        });

        saveTeacherSubjects(list);
        document.getElementById('subjectForm').reset();
        state.subjectScheduleDraft = [];
        renderSubjectScheduleDraft();
        renderAll();
        showToast('Subject saved successfully.');
      }

      function updateSubject(event) {
        event.preventDefault();
        const list = getTeacherSubjects();
        const target = list.find((item) => item.id === document.getElementById('subjectEditId').value);
        if (!target) return;

        const name = document.getElementById('subjectEditName').value.trim();
        const code = document.getElementById('subjectEditCode').value.trim();
        const description = document.getElementById('subjectEditDescription').value.trim();

        if (!name || !code || !description) {
          alert('Please fill in the required subject fields.');
          return;
        }

        target.name = name;
        target.code = code;
        target.course = code;
        target.access = '';
        target.description = description;
        target.color = target.color || 'purple';
        target.schedules = JSON.parse(document.getElementById('subjectEditId').dataset.scheduleDraft || '[]');

        saveTeacherSubjects(list);
        closeSubjectEditor();
        renderAll();
        showToast('Subject updated successfully.');
      }

      function deleteSubject(subjectId) {
        const ok = window.confirm('Delete this subject and all of its announcements?');
        if (!ok) return;

        const list = getTeacherSubjects().filter((item) => item.id !== subjectId);
        saveTeacherSubjects(list);
        renderAll();
        showToast('Subject deleted successfully.');
      }

      function saveAnnouncement(event) {
        event.preventDefault();

        const subjectId = document.getElementById('announcementSubjectId').value;
        const title = document.getElementById('announcementTitleInput').value.trim();
        const announcementType = document.getElementById('announcementTypeInput').value;
        const details = document.getElementById('announcementDetailsInput').value.trim();
        const startDateTime = document.getElementById('announcementStartInput').value;
        const deadlineDateTime = document.getElementById('announcementDeadlineInput').value;
        const fileInput = document.getElementById('announcementImagesInput');
        const preview = document.getElementById('announcementPreviewList');

        if (!title || !details || !startDateTime || !deadlineDateTime) {
          alert('Please complete all announcement fields including the schedule and deadline.');
          return;
        }

        const list = getTeacherSubjects();
        const subject = list.find((item) => item.id === subjectId);
        if (!subject) return;

        const announcements = subject.announcements || [];
        const announcementId = document.getElementById('announcementEditId').value;

        const imagePromise = state.pendingAnnouncementImages.length
          ? Promise.resolve(state.pendingAnnouncementImages.slice())
          : readFilesAsDataUrls(fileInput.files);

        imagePromise.then((images) => {
          if (announcementId) {
            const current = announcements.find((item) => item.id === announcementId);
            if (current) {
              current.title = title;
              current.announcementType = announcementType;
              current.details = details;
              current.startDateTime = startDateTime;
              current.deadlineDateTime = deadlineDateTime;
              current.images = images.length ? images : (current.images || []);
              current.status = new Date(deadlineDateTime) > new Date() ? 'active' : 'completed';
            }
            alert('Announcement updated successfully.');
          } else {
            announcements.push({
              id: crypto.randomUUID(),
              title,
              announcementType,
              details,
              startDateTime,
              deadlineDateTime,
              images,
              createdAt: new Date().toISOString(),
              status: new Date(deadlineDateTime) > new Date() ? 'active' : 'completed'
            });
            alert('Announcement saved successfully.');
          }

          subject.announcements = announcements;
          saveTeacherSubjects(list);
          fileInput.value = '';
          state.pendingAnnouncementImages = [];
          closeAnnouncementEditor();
          renderAll();
          preview.innerHTML = '';
          showToast('Announcement saved successfully.');
        }).catch(() => {
          showToast('Image upload failed. Please try again.', 'error');
        });
      }

      function deleteAnnouncement(subjectId, announcementId) {
        const ok = window.confirm('Delete this announcement?');
        if (!ok) return;

        const list = getTeacherSubjects();
        const subject = list.find((item) => item.id === subjectId);
        if (!subject) return;

        subject.announcements = (subject.announcements || []).filter((item) => item.id !== announcementId);
        saveTeacherSubjects(list);
        renderAll();
        showToast('Announcement deleted successfully.');
      }

      function setSidebarOpen(isOpen) {
        const sidebar = document.querySelector('.sidebar');
        const backdrop = document.getElementById('mobileBackdrop');
        if (!sidebar) return;

        sidebar.classList.toggle('expanded', isOpen);
        sidebar.classList.toggle('mobile-open', isOpen);
        if (backdrop) {
          backdrop.classList.toggle('show', isOpen);
        }
      }

      function isSidebarExpanded() {
        const sidebar = document.querySelector('.sidebar');
        return !!(sidebar && sidebar.classList.contains('expanded'));
      }

      function syncBurgerMenu() {
        const burgerMenu = document.getElementById('burgerMenu');
        if (!burgerMenu) return;
        burgerMenu.style.display = 'block';
        burgerMenu.style.visibility = 'visible';
        burgerMenu.style.pointerEvents = 'auto';
        burgerMenu.disabled = false;
        burgerMenu.setAttribute('aria-label', 'Open menu');
        burgerMenu.classList.add('teacher-visible');
      }

      function bindSubjectActionButtons() {
        document.querySelectorAll('[data-edit-subject]').forEach((button) => {
          button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            openSubjectEditor(button.dataset.editSubject);
          };
        });

        document.querySelectorAll('[data-delete-subject]').forEach((button) => {
          button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            deleteSubject(button.dataset.deleteSubject);
          };
        });
      }

      function bindAnnouncementActionButtons() {
        document.querySelectorAll('[data-edit-announcement]').forEach((button) => {
          button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            openAnnouncementEditor(button.dataset.subjectId, button.dataset.editAnnouncement);
          };
        });

        document.querySelectorAll('[data-delete-announcement]').forEach((button) => {
          button.onclick = (event) => {
            event.preventDefault();
            event.stopPropagation();
            deleteAnnouncement(button.dataset.subjectId, button.dataset.deleteAnnouncement);
          };
        });
      }

      function bindEvents() {
        document.querySelectorAll('.nav-btn').forEach((button) => {
          button.addEventListener('click', () => {
            state.currentView = button.dataset.view;
            renderAll();
            if (window.innerWidth <= 980) {
              setSidebarOpen(false);
            }
          });
        });

        document.getElementById('manageAddSubjectBtn').addEventListener('click', () => {
          state.currentView = 'create';
          renderAll();
        });

        document.getElementById('subjectForm').addEventListener('submit', createSubject);
        document.getElementById('subjectEditForm').addEventListener('submit', updateSubject);
        document.getElementById('announcementEditForm').addEventListener('submit', saveAnnouncement);

        const announcementImageInput = document.getElementById('announcementImagesInput');
        if (announcementImageInput) {
          announcementImageInput.addEventListener('change', async (event) => {
            const preview = document.getElementById('announcementPreviewList');
            const images = await readFilesAsDataUrls(event.target.files);
            state.pendingAnnouncementImages = images;
            preview.innerHTML = images.map((src) => `<img src="${src}" alt="announcement preview" />`).join('');
          });
        }

        const scheduleRows = document.getElementById('subjectScheduleRows');
        const addScheduleButton = document.getElementById('addScheduleDayBtn');
        const editScheduleRows = document.getElementById('subjectEditScheduleRows');
        const addEditScheduleButton = document.getElementById('addEditScheduleDayBtn');
        if (scheduleRows) {
          scheduleRows.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-remove-schedule]');
            if (!btn) return;
            const idx = Number(btn.dataset.removeSchedule);
            if (Number.isNaN(idx)) return;
            state.subjectScheduleDraft = state.subjectScheduleDraft.filter((_, i) => i !== idx);
            renderSubjectScheduleDraft();
          });
        }
        if (editScheduleRows) {
          editScheduleRows.addEventListener('click', (event) => {
            const btn = event.target.closest('[data-remove-edit-schedule]');
            if (!btn) return;
            const idx = Number(btn.dataset.removeEditSchedule);
            if (Number.isNaN(idx)) return;
            const current = JSON.parse(document.getElementById('subjectEditId').dataset.scheduleDraft || '[]');
            const updated = current.filter((_, i) => i !== idx);
            document.getElementById('subjectEditId').dataset.scheduleDraft = JSON.stringify(updated);
            renderEditScheduleDraft(updated);
          });
        }
        if (addScheduleButton) {
          addScheduleButton.addEventListener('click', addScheduleDraft);
        }
        if (addEditScheduleButton) {
          addEditScheduleButton.addEventListener('click', addEditScheduleDraft);
        }

        document.body.addEventListener('click', (event) => {
          const target = event.target;
          const element = target.closest('[data-open-subject]');
          const editSubjectBtn = target.closest('[data-edit-subject]');
          const deleteSubjectBtn = target.closest('[data-delete-subject]');
          const addAnnouncementBtn = target.closest('[data-add-announcement]');
          const viewSubjectBtn = target.closest('[data-view-subject]');
          const editAnnouncementBtn = target.closest('[data-edit-announcement]');
          const deleteAnnouncementBtn = target.closest('[data-delete-announcement]');

          if (editSubjectBtn) {
            event.preventDefault();
            event.stopPropagation();
            openSubjectEditor(editSubjectBtn.dataset.editSubject);
            return;
          }

          if (deleteSubjectBtn) {
            event.preventDefault();
            event.stopPropagation();
            deleteSubject(deleteSubjectBtn.dataset.deleteSubject);
            return;
          }

          if (editAnnouncementBtn) {
            event.preventDefault();
            event.stopPropagation();
            openAnnouncementEditor(editAnnouncementBtn.dataset.subjectId, editAnnouncementBtn.dataset.editAnnouncement);
            return;
          }

          if (deleteAnnouncementBtn) {
            event.preventDefault();
            event.stopPropagation();
            deleteAnnouncement(deleteAnnouncementBtn.dataset.subjectId, deleteAnnouncementBtn.dataset.deleteAnnouncement);
            return;
          }

          if (addAnnouncementBtn) {
            openAnnouncementEditor(addAnnouncementBtn.dataset.addAnnouncement);
            return;
          }

          if (target.matches('[data-view-subject]')) {
            state.currentView = 'subject';
            state.selectedSubjectId = target.dataset.viewSubject;
            renderAll();
            return;
          }

          if (element) {
            state.selectedSubjectId = element.dataset.openSubject;
            const isDashboardCard = !!target.closest('.subject-glow-card');
            if (isDashboardCard || isStudentMode()) {
              renderStudentSubjectDetailPage();
              return;
            }
            state.currentView = 'subject';
            renderAll();
            return;
          }

          if (target.matches('[data-close-subject-modal]')) {
            closeSubjectEditor();
            return;
          }

          if (target.matches('[data-close-announcement-modal]')) {
            closeAnnouncementEditor();
          }

          if (target.matches('[data-open-announcement-image]')) {
            openAnnouncementImageViewer(target.dataset.openAnnouncementImage);
            return;
          }

          if (target.matches('[data-close-image-viewer]')) {
            closeAnnouncementImageViewer();
            return;
          }

          if (target.closest('[data-close-image-viewer]')) {
            closeAnnouncementImageViewer();
            return;
          }

          if (target === document.getElementById('imageViewerModal')) {
            closeAnnouncementImageViewer();
          }
        });

        const burgerMenu = document.getElementById('burgerMenu');
        const mobileBackdrop = document.getElementById('mobileBackdrop');

        if (burgerMenu) {
          burgerMenu.addEventListener('click', (event) => {
            event.preventDefault();
            event.stopPropagation();
            const sidebar = document.querySelector('.sidebar');
            if (!sidebar) return;
            const shouldOpen = !sidebar.classList.contains('expanded');
            setSidebarOpen(shouldOpen);
          });
        }

        if (mobileBackdrop) {
          mobileBackdrop.addEventListener('click', () => setSidebarOpen(false));
        }
      }

      function isStudentMode() {
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        return !!code && code === state.currentTeacher.classCode;
      }

      function getStudentContentRoot() {
        const shell = document.getElementById('appShell');
        if (!shell) return null;

        let content = shell.querySelector('main.content');
        if (!content) {
          content = document.createElement('main');
          content.className = 'content';
          shell.appendChild(content);
        }

        return content;
      }

      function renderStudentSubjectDetailPage() {
        const shell = document.getElementById('appShell');
        const content = getStudentContentRoot();
        const subject = getSubjectById(state.selectedSubjectId);

        if (!shell || !content) return;

        shell.classList.add('student-shell');
        shell.classList.remove('teacher-shell');

        if (!subject) {
          content.innerHTML = `
            <div class="panel-box" style="width: min(1100px, 100%); margin: 0 auto;">
              <div class="empty-state">No subject selected.</div>
            </div>
          `;
          return;
        }

        const { active, completed } = getSortedAnnouncements(subject);

        content.innerHTML = `
          <div class="view-header" style="width: min(1100px, 100%); margin: 0 auto;">
            <div>
              <div style="color: var(--subtle); text-transform: uppercase; letter-spacing: 0.08em; font-size:0.72rem;">Student view</div>
              <h2 style="margin: 6px 0 0; font-size:1.8rem;">${escapeHtml(subject.name)}</h2>
            </div>
            <button type="button" class="secondary-btn" data-back-to-student-dashboard>Back to dashboard</button>
          </div>

          <div class="panel-box" style="width: min(1100px, 100%); margin: 0 auto;">
            <div class="section-title">
              <h3>${escapeHtml(subject.name)}</h3>
              <span class="subject-course">${escapeHtml(subject.course)}</span>
            </div>
            <p style="color: var(--muted); margin: 0 0 14px;">${escapeHtml(subject.description || 'No short description added yet.')}</p>
            <div class="panel-box" style="padding:12px; margin: 0 0 14px;">
              <div style="color: var(--subtle); font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px;">Class schedule</div>
              <strong>${escapeHtml(formatScheduleSummary(subject.schedules || []))}</strong>
            </div>
          </div>

          <div class="announcement-split" style="width: min(1100px, 100%); margin: 0 auto;">
            <div class="announcement-column">
              <div class="section-title"><h3>Active</h3></div>
              <div class="announcement-list-panel">
                ${(active.length ? active : []).map((item) => `
                  <div class="announcement-card">
                    <div class="announcement-head">
                      <span class="type-badge">${escapeHtml(item.announcementType || 'reminder')}</span>
                      <span class="announcement-tag active">Active</span>
                    </div>
                    <h4>${escapeHtml(item.title)}</h4>
                    <p>${escapeHtml(item.details)}</p>
                    <div class="announcement-foot">
                      <span>Start: ${formatDateTime(item.startDateTime || item.deadlineDateTime || item.deadline)}</span>
                      <span>Deadline: ${formatDateTime(item.deadlineDateTime || item.deadline)}</span>
                    </div>
                  </div>
                `).join('') || '<div class="empty-state">No active announcements yet.</div>'}
              </div>
            </div>

            <div class="announcement-column">
              <div class="section-title"><h3>Completed</h3></div>
              <div class="announcement-list-panel">
                ${(completed.length ? completed : []).map((item) => `
                  <div class="announcement-card done">
                    <div class="announcement-head">
                      <span class="type-badge">${escapeHtml(item.announcementType || 'reminder')}</span>
                      <span class="announcement-tag done">Completed</span>
                    </div>
                    <h4>${escapeHtml(item.title)}</h4>
                    <p>${escapeHtml(item.details)}</p>
                    <div class="announcement-foot">
                      <span>Start: ${formatDateTime(item.startDateTime || item.deadlineDateTime || item.deadline)}</span>
                      <span>Deadline: ${formatDateTime(item.deadlineDateTime || item.deadline)}</span>
                    </div>
                  </div>
                `).join('') || '<div class="empty-state">No completed announcements yet.</div>'}
              </div>
            </div>
          </div>
        `;

        const backBtn = document.querySelector('[data-back-to-student-dashboard]');
        if (backBtn) {
          backBtn.addEventListener('click', () => {
            renderStudentOnlyDashboard();
            syncBurgerMenu();
          });
        }
      }

      function renderStudentOnlyDashboard() {
        const shell = document.getElementById('appShell');
        const content = getStudentContentRoot();
        if (!shell || !content) return;

        shell.classList.add('student-shell');
        shell.classList.remove('teacher-shell');
        content.innerHTML = `
          <div class="teacher-name-header" style="margin-bottom: 18px; width: min(1200px, 100%); margin-left: auto; margin-right: auto;">
            <div>
              <div class="hero-lettering">Student dashboard</div>
              <h2>${escapeHtml(state.currentTeacher.name || 'Teacher')}</h2>
            </div>
            <div class="header-badge">${escapeHtml(state.currentTeacher.className || 'Class')}</div>
          </div>

          <div id="studentDashboardContent" class="dashboard-grid" style="width: min(1200px, 100%); margin: 0 auto;"></div>
        `;

        const subjects = getTeacherSubjects();
        const dashboard = document.getElementById('studentDashboardContent');

        if (!dashboard) return;

        dashboard.innerHTML = subjects.map((subject) => {
          const { active, completed } = getSortedAnnouncements(subject);
          return `
            <button class="subject-glow-card" type="button" data-open-subject="${subject.id}">
              <div class="subject-glow-top">
                <span class="subject-chip">${escapeHtml(subject.course)}</span>
                <span class="stat-pill">${active.length} active</span>
              </div>
              <div>
                <h3>${escapeHtml(subject.name)}</h3>
                <p>${escapeHtml(subject.description || 'No short description added yet.')}</p>
              </div>
              <div class="subject-glow-meta">
                <span>${(subject.announcements || []).length} total</span>
              </div>
              <div class="subject-glow-meta">
                <span>${completed.length} completed</span>
                <span>${active.length} ongoing</span>
              </div>
              <div class="subject-glow-bar"></div>
            </button>
          `;
        }).join('');

        dashboard.querySelectorAll('[data-open-subject]').forEach((button) => {
          button.addEventListener('click', () => {
            state.selectedSubjectId = button.dataset.openSubject;
            renderStudentSubjectDetailPage();
          });
        });

        syncBurgerMenu();
      }

      function init() {
        ensureDefaultTeacher();
        ensureDefaultSubjects();

        if (isStudentMode()) {
          renderStudentOnlyDashboard();
          syncBurgerMenu();
          return;
        }

        const appShell = document.getElementById('appShell');
        appShell.classList.remove('student-shell');
        appShell.classList.add('teacher-shell');
        appShell.classList.remove('hidden');
        syncBurgerMenu();
        setSidebarOpen(false);
        window.addEventListener('resize', () => {
          syncBurgerMenu();
          if (window.innerWidth > 980) {
            setSidebarOpen(false);
          }
        });

        renderAll();
        bindEvents();
        bindSubjectActionButtons();
        bindAnnouncementActionButtons();
      }

      window.addEventListener('load', init);
    </script>
  </body>
</html>
